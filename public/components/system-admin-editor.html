<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaboConnect - Content Editor</title>
    <link rel="stylesheet" href="../css/global.css">
    <style>
        .editor-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .editor-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .editor-header h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
        }
        
        .editor-header p {
            margin: 0;
            opacity: 0.95;
        }
        
        .editor-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .editor-nav button {
            padding: 10px 20px;
            border: none;
            background: #f0f0f0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .editor-nav button.active {
            background: #667eea;
            color: white;
        }
        
        .editor-nav button:hover {
            background: #667eea;
            color: white;
        }
        
        .editor-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        @media (max-width: 1200px) {
            .editor-layout {
                grid-template-columns: 1fr;
            }
        }
        
        .editor-section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .editor-section h2 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .form-group.file-upload {
            position: relative;
        }
        
        .form-group.file-upload input[type="file"] {
            padding: 12px;
            border: 2px dashed #667eea;
            background: #f9f9f9;
            cursor: pointer;
        }
        
        .preview-image {
            margin-top: 10px;
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        
        .preview-section {
            padding: 20px;
            background: #f9f9f9;
            border-radius: 6px;
            margin-top: 15px;
        }
        
        .preview-section h3 {
            margin-top: 0;
            color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .status-message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
        
        .status-message.show {
            display: block;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .code-editor {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .logout-link {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.3s ease;
        }
        
        .logout-link:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <a href="#" onclick="logoutUser(); return false;" class="logout-link">Logout</a>
    
    <div class="editor-container">
        <div class="editor-header">
            <h1>🌐 LaboConnect Content Editor</h1>
            <p>Welcome! You can edit website content and images from here.</p>
        </div>
        
        <div id="statusMessage" class="status-message"></div>
        
        <div class="editor-nav">
            <button class="active" onclick="switchEditor('quick')">Quick Edit</button>
            <button onclick="switchEditor('fullcode')">Full HTML Code</button>
        </div>
        
        <!-- Quick Edit Mode -->
        <div id="quickEditor" class="editor-layout">
            <div class="editor-section">
                <h2>✏️ Content Sections</h2>
                
                <div class="form-group">
                    <label>Select Section to Edit:</label>
                    <select id="sectionSelect" onchange="loadSectionPreview()">
                        <option value="">Choose a section...</option>
                        <option value="hero-title">Hero Title</option>
                        <option value="hero-subtitle">Hero Subtitle</option>
                        <option value="hero-cta">Hero CTA Button</option>
                        <option value="why-labo-heading">Why LaboConnect Heading</option>
                        <option value="why-labo-text">Why LaboConnect Description</option>
                        <option value="opportunities-heading">Opportunities Heading</option>
                        <option value="opportunities-text">Opportunities Description</option>
                        <option value="process-heading">How It Works Heading</option>
                        <option value="process-text">How It Works Description</option>
                        <option value="testimonials-heading">Success Stories Heading</option>
                        <option value="testimonials-text">Success Stories Description</option>
                        <option value="faq-heading">FAQ Heading</option>
                        <option value="cta-section-title">CTA Section Title</option>
                        <option value="cta-section-text">CTA Section Description</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Edit Content:</label>
                    <textarea id="contentField" placeholder="Edit content here..."></textarea>
                </div>
                
                <div class="button-group">
                    <button class="btn btn-primary" onclick="saveContent()">💾 Save Changes</button>
                    <button class="btn btn-secondary" onclick="resetContent()">↺ Reset</button>
                </div>
            </div>
            
            <div class="editor-section">
                <h2>👁️ Live Preview</h2>
                <div id="previewContent" class="preview-section">
                    <p style="color: #999;">Select a section to preview</p>
                </div>
            </div>
        </div>
        
        <!-- Full Code Editor Mode -->
        <div id="fullcodeEditor" style="display: none;">
            <div class="editor-section">
                <h2>📝 Full HTML Code</h2>
                <p style="color: #666; font-size: 13px;">⚠️ Advanced users only. Edit the complete HTML code below.</p>
                
                <div class="form-group">
                    <textarea id="fullCodeField" placeholder="HTML code will be loaded here..." style="min-height: 500px; font-family: 'Courier New', monospace;"></textarea>
                </div>
                
                <div class="button-group">
                    <button class="btn btn-primary" onclick="saveFullCode()">💾 Save Full Code</button>
                    <button class="btn btn-secondary" onclick="loadFullCode()">↺ Reload</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize editor on page load
        document.addEventListener('DOMContentLoaded', async function() {
            // Check if user is logged in and is system_admin
            try {
                const sessionRes = await fetch('/api/session');
                const sessionData = await sessionRes.json();
                
                if (!sessionData.user || sessionData.user.admin_role !== 'system_admin') {
                    window.location.href = '/components/index.html';
                    return;
                }
            } catch (err) {
                console.error('Session check failed:', err);
                window.location.href = '/components/index.html';
            }
            
            // Load initial content
            await loadFullCode();
        });
        
        function switchEditor(mode) {
            const quickEditor = document.getElementById('quickEditor');
            const fullcodeEditor = document.getElementById('fullcodeEditor');
            const buttons = document.querySelectorAll('.editor-nav button');
            
            buttons.forEach(btn => btn.classList.remove('active'));
            
            if (mode === 'quick') {
                quickEditor.style.display = 'grid';
                fullcodeEditor.style.display = 'none';
                event.target.classList.add('active');
            } else {
                quickEditor.style.display = 'none';
                fullcodeEditor.style.display = 'block';
                event.target.classList.add('active');
            }
        }
        
        async function loadFullCode() {
            try {
                const res = await fetch('/api/system-admin/content/index');
                const data = await res.json();
                document.getElementById('fullCodeField').value = data.content;
            } catch (err) {
                showStatus('Error loading content: ' + err.message, 'error');
                console.error('Error loading content:', err);
            }
        }
        
        function loadSectionPreview() {
            const section = document.getElementById('sectionSelect').value;
            if (!section) {
                document.getElementById('previewContent').innerHTML = '<p style="color: #999;">Select a section to preview</p>';
                return;
            }
            
            // Extract section content from full code
            const fullCode = document.getElementById('fullCodeField').value;
            // This is a simplified preview - in a real app, you'd parse and find specific content
            document.getElementById('previewContent').innerHTML = '<p style="color: #999;">Preview functionality coming soon</p>';
        }
        
        async function saveContent() {
            const section = document.getElementById('sectionSelect').value;
            const content = document.getElementById('contentField').value;
            
            if (!section) {
                showStatus('Please select a section to edit', 'error');
                return;
            }
            
            if (!content.trim()) {
                showStatus('Content cannot be empty', 'error');
                return;
            }
            
            try {
                // For now, save the full code with the updated content
                // In a production app, you'd have a more sophisticated content management system
                showStatus('Saving...', 'success');
                
                const fullCode = document.getElementById('fullCodeField').value;
                // This would need to be smarter to find and replace the specific section
                
                showStatus('Content saved successfully! ✓', 'success');
            } catch (err) {
                showStatus('Error saving content: ' + err.message, 'error');
                console.error('Error saving content:', err);
            }
        }
        
        async function saveFullCode() {
            const content = document.getElementById('fullCodeField').value;
            
            if (!content.trim()) {
                showStatus('Code cannot be empty', 'error');
                return;
            }
            
            try {
                const btn = event.target;
                btn.disabled = true;
                btn.innerHTML = '<span class="loading">⏳</span> Saving...';
                
                const res = await fetch('/api/system-admin/content/index', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content })
                });
                
                if (!res.ok) {
                    const error = await res.json();
                    throw new Error(error.error || 'Failed to save content');
                }
                
                showStatus('✓ Content saved successfully! A backup was created.', 'success');
                btn.disabled = false;
                btn.innerHTML = '💾 Save Full Code';
            } catch (err) {
                showStatus('Error saving content: ' + err.message, 'error');
                console.error('Error saving content:', err);
                if (event.target) {
                    event.target.disabled = false;
                    event.target.innerHTML = '💾 Save Full Code';
                }
            }
        }
        
        function resetContent() {
            document.getElementById('sectionSelect').value = '';
            document.getElementById('contentField').value = '';
            document.getElementById('previewContent').innerHTML = '<p style="color: #999;">Select a section to preview</p>';
        }
        
        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = 'status-message show ' + type;
            
            setTimeout(() => {
                statusEl.classList.remove('show');
            }, 5000);
        }
        
        function logoutUser() {
            fetch('/logout', { method: 'POST' }).then(() => {
                window.location.href = '/components/index.html';
            });
        }
    </script>
</body>
</html>
