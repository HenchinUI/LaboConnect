<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>My Conversations</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/home.css" />
</head>
<body>
  <div id="header-import"></div>
  <main class="wrap" style="padding-top:28px;">
    <h2>My Conversations</h2>
    <div id="threadsContainer" style="margin-top:18px;display:flex;flex-direction:column;gap:12px;">
      <div class="small muted">Loading conversations...</div>
    </div>
  </main>

  <script src="/js/global.js"></script>
  <script src="/js/home.js"></script>
  <script>
    async function loadConversations(){
      const container = document.getElementById('threadsContainer');
      container.innerHTML = '<div class="small muted">Loading conversations...</div>';
      try {
        const user = JSON.parse(localStorage.getItem('laboCurrentUser'));
        if (!user) { container.innerHTML = '<div class="small muted">Please log in to view your conversations.</div>'; return; }

        const [ownerRes, senderRes] = await Promise.all([
          fetch('/api/inquiries?owner_id=' + encodeURIComponent(user.id)),
          fetch('/api/inquiries?sender_user_id=' + encodeURIComponent(user.id))
        ]);
        const ownerData = await ownerRes.json();
        const senderData = await senderRes.json();
        
        // Mark inquiries that came from owner query (user is the listing owner)
        const ownerInquiries = (ownerData.inquiries || []).map(i => ({...i, isOwner: true}));
        const senderInquiries = (senderData.inquiries || []).map(i => ({...i, isOwner: false}));
        
        const items = ownerInquiries.concat(senderInquiries);
        const map = new Map();
        items.forEach(i => { if (i && i.id) map.set(i.id, i); });
        const threads = Array.from(map.values()).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

        if (!threads.length) { container.innerHTML = '<div class="small muted">No conversations yet.</div>'; return; }
        container.innerHTML = '';

        threads.forEach(t => {
          const card = document.createElement('div');
          card.className = 'side-card';
          card.style.display = 'flex';
          card.style.justifyContent = 'space-between';
          card.style.alignItems = 'center';

          const left = document.createElement('div');
          left.innerHTML = `<div style="font-weight:800">${t.first_name} ${t.last_name} <span class="small muted">(${t.created_at? new Date(t.created_at).toLocaleString():''})</span></div>
            <div class="small muted">Listing: ${t.listing_id} — ${t.message? t.message.substring(0,120):''}</div>`;

          const right = document.createElement('div');
          right.style.display = 'flex';
          right.style.flexDirection = 'column';
          right.style.gap = '8px';

          const openBtn = document.createElement('button');
          openBtn.className = 'btn btn-primary';
          openBtn.textContent = 'Open Chat';
          openBtn.onclick = () => { if (window.openChat) openChat(t.id, t.first_name + ' ' + t.last_name); else alert('Chat not available'); };

          const viewBtn = document.createElement('button');
          viewBtn.className = 'btn btn-ghost';
          viewBtn.textContent = 'View Listing';
          viewBtn.onclick = () => { window.location.href = '/components/listing-detail.html?id=' + t.listing_id };

          right.appendChild(openBtn);
          right.appendChild(viewBtn);
          
          // Add "Mark as Sold" button for listing owner (business user)
          if (t.isOwner && user.user_type === 'business') {
            const markSoldBtn = document.createElement('button');
            markSoldBtn.className = 'btn btn-success';
            markSoldBtn.textContent = 'Mark as Sold';
            markSoldBtn.style.backgroundColor = '#10b981';
            markSoldBtn.onclick = () => { markListingAsSold(t.listing_id, t.sender_user_id, t.id, t); };
            right.appendChild(markSoldBtn);
          }

          card.appendChild(left);
          card.appendChild(right);

          container.appendChild(card);
        });

      } catch (e) {
        container.innerHTML = '<div class="small muted">Error loading conversations</div>';
        console.error(e);
      }
    }

    document.addEventListener('DOMContentLoaded', () => setTimeout(loadConversations, 200));

    // Mark listing as sold
    async function markListingAsSold(listingId, buyerId, inquiryId, inquiryData) {
      // First get the listing price
      try {
        const listingRes = await fetch(`/api/listings/${listingId}`);
        const listing = await listingRes.json();
        
        const salePrice = listing.price || 0;
        
        // Show confirmation dialog with price
        const confirmed = confirm(`Mark this listing as sold to ${inquiryData.first_name} ${inquiryData.last_name}?\n\nListing: ${listing.title}\nSale Price: $${salePrice}\n\nThis will mark this listing as sold and close all other inquiries.`);
        
        if (!confirmed) return;
        
        // Call API to mark as sold
        const response = await fetch(`/api/listings/${listingId}/mark-sold`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            buyerId,
            inquiryId,
            salePrice
          })
        });
        
        const result = await response.json();
        
        if (!response.ok) {
          alert('Error: ' + (result.error || 'Failed to mark listing as sold'));
          return;
        }
        
        alert('✅ Listing marked as sold! The buyer has been notified.');
        loadConversations(); // Refresh the list
        
      } catch (err) {
        console.error('Error marking listing as sold:', err);
        alert('Error marking listing as sold');
      }
    }
  </script>
</body>
</html>
